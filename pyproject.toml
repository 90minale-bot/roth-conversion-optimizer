[project]
name = "retirement-tax-optimizer"
version = "0.1.0"
description = "Streamlit retirement rollover and Roth conversion planning baseline"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.36",
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.22",
  "openpyxl>=3.1",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
